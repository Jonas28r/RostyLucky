<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RostyLucky - Play & Earn Global</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; height: 75vh; overflow-y: auto; padding-bottom: 120px; }
        .active-tab { display: block; }
        
        /* Estilos Ruleta Premium */
        #wheel-container { position: relative; width: 280px; height: 280px; margin: 0 auto; }
        #wheel-main { 
            width: 100%; height: 100%; border-radius: 50%; border: 8px solid #1e293b;
            position: relative; overflow: hidden; transition: transform 7s cubic-bezier(0.15, 0, 0.15, 1);
            background: conic-gradient(
                #facc15 0deg 45deg, #eab308 45deg 90deg, 
                #facc15 90deg 135deg, #eab308 135deg 180deg,
                #facc15 180deg 225deg, #eab308 225deg 270deg,
                #facc15 270deg 315deg, #eab308 315deg 360deg
            );
            box-shadow: 0 0 50px rgba(234, 179, 8, 0.2), inset 0 0 20px rgba(0,0,0,0.5);
        }
        .wheel-marker {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 40px; background: #ef4444; clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
            z-index: 10; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5));
        }
        .wheel-segment {
            position: absolute; width: 50%; height: 50%; transform-origin: 100% 100%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        #wheel-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 60px; height: 60px; background: #0f172a; border-radius: 50%;
            border: 4px solid #facc15; z-index: 5; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Animaciones */
        #tap-area:active { transform: scale(0.92); }
        .anim-float { position: absolute; font-weight: 800; color: #facc15; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
        .mining-active { color: #22d3ee; animation: pulse 1.5s infinite; text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="p-4">

    <div class="glass p-4 rounded-2xl mb-4 flex justify-between items-center border-b-2 border-yellow-500/20 shadow-2xl">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Puntos Totales</p>
            <p class="text-xl font-black text-yellow-400" id="display-pts">0</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">Balance USDT</p>
            <p class="text-xl font-black text-green-400">$<span id="user-balance">0.0000</span></p>
        </div>
    </div>

    <main>
        <div id="tab-home" class="tab-content active-tab text-center pt-6">
            <div class="mb-6">
                <span class="bg-cyan-900/50 text-cyan-400 px-4 py-1 rounded-full text-xs font-bold border border-cyan-500/30">
                    ⚡ Energía: <span id="user-energy">0</span>
                </span>
            </div>
            <div id="tap-area" ontouchstart="handleTap(event)" class="relative mx-auto w-56 h-56 bg-gradient-to-tr from-yellow-600 to-orange-400 rounded-full flex items-center justify-center shadow-[0_0_60px_rgba(234,179,8,0.3)] border-[12px] border-white/5 active:scale-90 transition-transform">
                <span class="text-8xl font-black italic text-white/20 select-none">R</span>
            </div>
            <p class="mt-8 text-slate-500 text-[10px] uppercase tracking-[0.2em]">100 Taps = 1 Energía</p>
        </div>

        <div id="tab-wheel" class="tab-content text-center pt-4 px-2">
            <button id="btn-daily" onclick="claimDaily()" class="mb-6 w-full glass border-yellow-500/50 p-3 rounded-2xl flex items-center justify-between active:scale-95 transition-all">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🎁</span>
                    <div class="text-left">
                        <p class="text-[10px] font-black text-yellow-400 uppercase">Bono Diario</p>
                        <p id="daily-timer" class="text-[9px] text-slate-400 font-bold">¡Reclamar ahora!</p>
                    </div>
                </div>
                <span class="bg-yellow-500 text-slate-900 text-[9px] px-2 py-1 rounded-lg font-black italic">+5 ENERGÍA</span>
            </button>

            <div class="glass p-6 rounded-[40px] mb-4 relative overflow-hidden">
                <div class="wheel-marker"></div>
                <div id="wheel-container">
                    <div id="wheel-main">
                        <div class="wheel-center" id="wheel-center">🎰</div>
                        <div class="wheel-segment" style="transform: rotate(0deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">💰</span></div>
                        <div class="wheel-segment" style="transform: rotate(45deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">❌</span></div>
                        <div class="wheel-segment" style="transform: rotate(90deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">💎</span></div>
                        <div class="wheel-segment" style="transform: rotate(135deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">❌</span></div>
                        <div class="wheel-segment" style="transform: rotate(180deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">💵</span></div>
                        <div class="wheel-segment" style="transform: rotate(225deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">❌</span></div>
                        <div class="wheel-segment" style="transform: rotate(270deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">🪙</span></div>
                        <div class="wheel-segment" style="transform: rotate(315deg) skewY(-45deg);"><span style="transform: skewY(45deg) rotate(22deg) translate(40px, -40px);">❌</span></div>
                    </div>
                </div>
                
                <button id="btn-spin" onclick="spinWheel()" class="mt-8 w-full bg-yellow-500 text-slate-900 py-4 rounded-2xl font-black text-lg shadow-[0_4px_0_#a16207] active:shadow-none active:translate-y-1 transition-all">GIRAR AHORA (1 ⚡)</button>
            </div>
        </div>

        <div id="tab-mine" class="tab-content text-center pt-6">
            <div class="glass p-8 rounded-3xl border-t-4 border-cyan-500">
                <div class="mb-4">
                    <p class="text-[10px] text-slate-400 uppercase font-black">Puntos esta sesión</p>
                    <p class="text-2xl font-bold text-cyan-400">+<span id="session-pts">0</span> pts</p>
                </div>
                <p id="mining-timer" class="text-5xl font-mono mb-8 tracking-tighter">03:00:00</p>
                <button id="btn-mine" onclick="startMining()" class="w-full bg-slate-800 py-4 rounded-2xl font-black border border-white/10 shadow-lg active:bg-slate-700">ACTIVAR MINERÍA (ADS)</button>
            </div>
        </div>

        <div id="tab-refs" class="tab-content px-2 pt-6">
            <div class="glass p-6 rounded-3xl text-center border-b-4 border-cyan-600">
                <p class="text-[10px] text-slate-400 font-bold uppercase mb-4">Tu Enlace de Invitación</p>
                <input type="text" id="ref-link" readonly class="w-full bg-slate-900/50 p-3 rounded-xl text-cyan-400 text-[10px] mb-4 text-center border border-white/5 outline-none">
                <button onclick="copyRef()" class="w-full bg-cyan-600 py-3 rounded-xl font-black text-sm">COPIAR ENLACE</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-4 right-4 glass flex justify-around p-4 rounded-3xl shadow-2xl z-50">
        <button onclick="showTab('home')" class="text-2xl">🏠</button>
        <button onclick="showTab('wheel')" class="text-2xl">🎡</button>
        <button onclick="showTab('mine')" class="text-2xl">⛏️</button>
        <button onclick="showTab('refs')" class="text-2xl">👥</button>
    </nav>

    <script>
        let pts = 0; let energy = 0; let balance = 0.00; let daily = 0.00; 
        let taps = 0; let isMining = false; let sessionPts = 0;
        let miningSeconds = 10800;

        function triggerPopunder() {
            window.open('https://www.profitablecpmratenetwork.com/hjxx0ympqj?key=3816a45c1ebae2a773ddb3dfcdaa95d5', '_blank');
        }

        function handleTap(e) {
            pts++; taps++;
            if (taps >= 100) { energy++; taps = 0; }
            createFloat(e.touches[0].clientX, e.touches[0].clientY);
            updateUI();
        }

        // --- SISTEMA DE RULETA PREMIUM ---
        function spinWheel() {
            if (energy < 1) { alert("¡Necesitas 1 ⚡ de Energía!"); return; }
            
            triggerPopunder(); // Abre el anuncio
            
            energy--;
            updateUI();
            
            const wheel = document.getElementById('wheel-main');
            const btn = document.getElementById('btn-spin');
            
            btn.disabled = true;
            btn.innerText = "¡SUERTE!";
            
            // Generar un giro de entre 5 y 10 vueltas completas + ángulo aleatorio
            const randomExtra = Math.floor(Math.random() * 360);
            const totalRotation = 3600 + randomExtra; // 10 vueltas (3600deg) + extra
            
            wheel.style.transform = `rotate(${totalRotation}deg)`;

            setTimeout(() => {
                // Reset de rotación visual para el siguiente giro sin que se note el salto
                wheel.style.transition = 'none';
                const currentDeg = totalRotation % 360;
                wheel.style.transform = `rotate(${currentDeg}deg)`;
                setTimeout(() => wheel.style.transition = 'transform 7s cubic-bezier(0.15, 0, 0.15, 1)', 50);

                btn.disabled = false;
                btn.innerText = "GIRAR AHORA (1 ⚡)";

                // Lógica de premio (8 segmentos de 45deg cada uno)
                // Determinamos en qué segmento cayó la flecha (arriba, 0deg)
                // La flecha está en 0, el premio es (360 - currentDeg)
                const winIndex = Math.floor(((360 - currentDeg) % 360) / 45);
                const isWinner = (winIndex % 2 === 0); // Los segmentos pares (0, 2, 4, 6) tienen premio

                if (isWinner) {
                    const winAmt = (Math.random() * 0.0018).toFixed(4);
                    if (daily < 0.02) {
                        balance += parseFloat(winAmt);
                        daily += parseFloat(winAmt);
                        alert(`🎁 ¡INCREÍBLE! Has ganado $${winAmt} USDT.`);
                    } else {
                        alert("Límite de USDT hoy alcanzado. ¡Mañana más!");
                    }
                } else {
                    alert("🎰 ¡Uffs, casi! No te rindas, la próxima será la buena.");
                }
                updateUI();
            }, 7000); // Duración del giro de 7 segundos
        }

        // --- REGALO DIARIO ---
        function claimDaily() {
            const last = localStorage.getItem('lastClaim');
            const now = Date.now();
            if (last && (now - last) < 86400000) { alert("Vuelve mañana para tu regalo."); return; }
            triggerPopunder();
            energy += 5;
            localStorage.setItem('lastClaim', now);
            updateDailyTimer();
            updateUI();
            alert("🎁 ¡Recibiste +5 ⚡ de regalo!");
        }

        function updateDailyTimer() {
            const last = localStorage.getItem('lastClaim');
            if (!last) return;
            const next = parseInt(last) + 86400000;
            const timer = () => {
                const diff = next - Date.now();
                if (diff <= 0) { document.getElementById('daily-timer').innerText = "¡Disponible ahora!"; return; }
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('daily-timer').innerText = `Disponible: ${h}:${m}:${s}`;
                setTimeout(timer, 1000);
            };
            timer();
        }

        // --- MINERIA ---
        function startMining() {
            if(isMining) return;
            triggerPopunder();
            isMining = true;
            document.getElementById('btn-mine').innerText = "MINANDO...";
            document.getElementById('mining-timer').classList.add('mining-active');
            
            const timerInterval = setInterval(() => {
                miningSeconds--;
                let h = Math.floor(miningSeconds / 3600).toString().padStart(2, '0');
                let m = Math.floor((miningSeconds % 3600) / 60).toString().padStart(2, '0');
                let s = (miningSeconds % 60).toString().padStart(2, '0');
                document.getElementById('mining-timer').innerText = `${h}:${m}:${s}`;
                if (miningSeconds % 10 === 0) { pts += 1; sessionPts += 1; document.getElementById('session-pts').innerText = sessionPts; updateUI(); }
                if (miningSeconds <= 0) { clearInterval(timerInterval); isMining = false; }
            }, 1000);
        }

        function createFloat(x, y) {
            const el = document.createElement("div");
            el.innerText = "+1"; el.className = "anim-float";
            el.style.left = x + "px"; el.style.top = y + "px";
            document.body.appendChild(el); setTimeout(() => el.remove(), 600);
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function updateUI() {
            document.getElementById('display-pts').innerText = pts;
            document.getElementById('user-balance').innerText = balance.toFixed(4);
            document.getElementById('user-energy').innerText = energy;
        }

        function copyRef() {
            const el = document.getElementById('ref-link');
            el.select(); document.execCommand('copy');
            alert("¡Enlace copiado!");
        }

        const tg = window.Telegram.WebApp;
        tg.expand();
        window.onload = () => {
            updateDailyTimer();
            const user = tg.initDataUnsafe.user;
            if (user) document.getElementById('ref-link').value = "https://t.me/RostyLuckyBot/play?start=" + user.id;
        };
    </script>
    <script src="https://pl29089430.profitablecpmratenetwork.com/dc/73/a2/dc73a2370cdcfb545e7a197bc8bb269a.js"></script>
</body>
</html>
