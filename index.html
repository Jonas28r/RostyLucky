<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RostyLucky - Secure Play</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; height: 70vh; overflow-y: auto; }
        .active-tab { display: block; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .anim-float { position: absolute; font-weight: bold; color: #facc15; pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body class="p-4">

    <div class="glass p-4 rounded-2xl mb-4 flex justify-between items-center shadow-2xl">
        <div>
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Nivel <span id="user-level">1</span></p>
            <p class="text-xl font-black text-yellow-400" id="user-points text-shadow">0 PTS</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Balance Hoy: $<span id="daily-limit">0.00</span>/0.02</p>
            <p class="text-xl font-black text-green-400">$<span id="user-balance">0.00</span></p>
        </div>
    </div>

    <main>
        <div id="tab-home" class="tab-content active-tab text-center pt-10">
            <h2 class="text-xl font-bold mb-2">Energía: <span id="user-energy" class="text-cyan-400">0</span></h2>
            
            <button onclick="detectBot()" style="opacity: 0.001; position: absolute; top: 0; left: 0;">RECLAMAR PREMIO MAYOR</button>

            <div id="tap-area" ontouchstart="handleTap(event)" class="relative mx-auto w-56 h-56 bg-gradient-to-tr from-orange-500 to-yellow-500 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(245,158,11,0.4)] active:scale-90 transition-transform cursor-pointer">
                <span class="text-7xl font-black">R</span>
            </div>
            <p class="mt-6 text-slate-400 text-sm">100 Taps = 1 Energía</p>
        </div>

        <div id="tab-mine" class="tab-content text-center pt-10">
             <div class="glass p-8 rounded-3xl inline-block w-full">
                <h2 class="text-2xl font-bold text-cyan-400 mb-4">MINERÍA USDT</h2>
                <p id="mining-timer" class="text-5xl font-mono mb-6 text-white">03:00:00</p>
                <button onclick="startMining()" class="w-full bg-cyan-600 py-4 rounded-xl font-bold shadow-lg active:bg-cyan-700">ACTIVAR (ADS)</button>
             </div>
        </div>

        <div id="tab-withdraw" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-center">Retirar Ganancias</h2>
            <div class="space-y-3">
                <div class="glass p-4 rounded-xl flex justify-between">
                    <span>Airtm / PayPal</span>
                    <span class="font-bold text-yellow-400">Min. $5.00</span>
                </div>
                <div class="glass p-4 rounded-xl flex justify-between">
                    <span>Pago Móvil (VE)</span>
                    <span class="font-bold text-yellow-400">Min. 680 Bs</span>
                </div>
                <p class="text-xs text-slate-500 text-center mt-4">Los retiros se procesan en un lapso de 24 a 72 horas hábiles para verificar la legitimidad de los puntos.</p>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-4 right-4 glass flex justify-around p-4 rounded-3xl">
        <button onclick="showTab('home')" class="text-xl">🏠</button>
        <button onclick="showTab('mine')" class="text-xl">⛏️</button>
        <button onclick="showTab('withdraw')" class="text-xl">💰</button>
    </nav>

    <script>
        // ESTADO GLOBAL
        let points = 0;
        let energy = 0;
        let balance = 0.00;
        let dailyEarned = 0.00;
        let tapsCount = 0;

        // SEGURIDAD ANTI-BOT
        let lastTapTime = 0;
        let tapFastCount = 0;

        function handleTap(e) {
            const now = Date.now();
            const interval = now - lastTapTime;

            // Bloqueo si hay más de 10 clics por segundo (100ms entre clics)
            if (interval < 100) {
                tapFastCount++;
                if (tapFastCount > 5) {
                    alert("¡Velocidad no humana detectada! Calma los dedos.");
                    return;
                }
            } else {
                tapFastCount = 0; // Reinicia si el ritmo es normal
            }
            lastTapTime = now;

            // Efecto Visual
            const touch = e.touches[0];
            createFloatingText(touch.clientX, touch.clientY);

            // Lógica de Ganancia
            tapsCount++;
            if (tapsCount >= 100) {
                energy++;
                tapsCount = 0;
                checkDailyLimit(0.001); // Gana un poquito por cada carga de energía
            }
            updateUI();
        }

        function checkDailyLimit(amount) {
            if (dailyEarned < 0.02) {
                balance += amount;
                dailyEarned += amount;
            } else {
                console.log("Límite diario alcanzado");
            }
        }

        function createFloatingText(x, y) {
            const el = document.createElement("div");
            el.innerText = "+1";
            el.className = "anim-float";
            el.style.left = x + "px";
            el.style.top = y + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function detectBot() {
            alert("Cuenta suspendida: Intento de uso de script detectado.");
            window.close();
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(4);
            document.getElementById('daily-limit').innerText = dailyEarned.toFixed(2);
            document.getElementById('user-energy').innerText = energy;
        }

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f172a');
    </script>
</body>
</html>
