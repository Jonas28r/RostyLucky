<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RostyLucky - Play & Earn Global</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; height: 75vh; overflow-y: auto; padding-bottom: 120px; }
        .active-tab { display: block; }
        #tap-area:active { transform: scale(0.92); }
        .anim-float { position: absolute; font-weight: 800; color: #facc15; pointer-events: none; animation: floatUp 0.6s ease-out forwards; z-index: 50; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
        .spinning { animation: rotate 2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .mining-active { color: #22d3ee; animation: pulse 1.5s infinite; text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="p-4">

    <div class="glass p-4 rounded-2xl mb-4 flex justify-between items-center shadow-2xl border-b-2 border-yellow-500/20">
        <div>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Puntos Totales</p>
            <p class="text-xl font-black text-yellow-400" id="display-pts">0</p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">Balance USDT</p>
            <p class="text-xl font-black text-green-400">$<span id="user-balance">0.0000</span></p>
        </div>
    </div>

    <main>
        <div id="tab-home" class="tab-content active-tab text-center pt-6">
            <div class="mb-6">
                <span class="bg-cyan-900/50 text-cyan-400 px-4 py-1 rounded-full text-xs font-bold border border-cyan-500/30 shadow-[0_0_15px_rgba(34,211,238,0.2)]">
                    ⚡ Energía: <span id="user-energy">0</span>
                </span>
            </div>
            <div id="tap-area" ontouchstart="handleTap(event)" class="relative mx-auto w-60 h-60 bg-gradient-to-tr from-yellow-600 to-orange-400 rounded-full flex items-center justify-center shadow-[0_0_60px_rgba(234,179,8,0.3)] border-[12px] border-white/5 active:scale-90 transition-transform">
                <span class="text-8xl font-black italic text-white/20 select-none">R</span>
            </div>
            <p class="mt-8 text-slate-500 text-[10px] uppercase tracking-[0.2em]">100 Taps = 1 Energía</p>
        </div>

        <div id="tab-wheel" class="tab-content text-center pt-6">
            <div class="glass p-6 rounded-3xl mb-4">
                <h2 class="text-xl font-bold mb-4 italic text-yellow-400">Lucky Spin</h2>
                <div id="wheel-graphic" class="w-48 h-48 mx-auto bg-gradient-to-r from-yellow-500 via-orange-500 to-red-500 rounded-full border-8 border-slate-800 flex items-center justify-center shadow-2xl relative">
                    <div class="w-1 h-10 bg-white absolute top-0 rounded-full shadow-lg"></div>
                    <span class="text-4xl">🎁</span>
                </div>
                <p class="mt-4 text-sm text-slate-300 italic">Costo: 1 Energía</p>
                <button onclick="spinWheel()" class="mt-6 w-full bg-yellow-500 text-slate-900 py-4 rounded-2xl font-black text-lg shadow-xl active:scale-95 transition-all uppercase">GIRAR AHORA</button>
            </div>
        </div>

        <div id="tab-mine" class="tab-content text-center pt-6">
            <div class="glass p-8 rounded-3xl border-t-4 border-cyan-500 relative">
                <div class="mb-4">
                    <p class="text-[10px] text-slate-400 uppercase font-black tracking-widest">Ganado esta sesión</p>
                    <p class="text-2xl font-bold text-cyan-400">+<span id="session-pts">0</span> <span class="text-xs">pts</span></p>
                </div>

                <h2 class="text-[10px] font-black text-slate-500 mb-2 uppercase tracking-widest italic">Cloud Mining Session</h2>
                <p id="mining-timer" class="text-5xl font-mono mb-8 tracking-tighter">03:00:00</p>
                
                <button id="btn-mine" onclick="startMining()" class="w-full bg-slate-800 py-4 rounded-2xl font-black border border-white/10 shadow-lg active:bg-slate-700 transition-colors">ACTIVAR MINERÍA (ADS)</button>
            </div>
            <p class="mt-4 text-[9px] text-slate-500 uppercase tracking-widest px-4">Recuerda mantener la app abierta para procesar los puntos.</p>
        </div>

        <div id="tab-refs" class="tab-content">
            <div class="glass p-6 rounded-3xl mb-4 text-center">
                <p class="text-xs text-slate-400 mb-1 font-bold uppercase">Tu Enlace Global</p>
                <input type="text" id="ref-link" readonly class="w-full bg-transparent text-cyan-400 text-[10px] mb-4 text-center outline-none border-b border-white/10 pb-2" value="Cargando link...">
                <button onclick="copyRef()" class="w-full bg-cyan-600 py-3 rounded-xl font-black text-sm mb-4 shadow-lg">COPIAR LINK</button>
                <a href="https://www.profitablecpmratenetwork.com/hjxx0ympqj?key=3816a45c1ebae2a773ddb3dfcdaa95d5" target="_blank" class="block w-full bg-white/5 border border-white/10 py-3 rounded-xl text-[10px] font-bold">🎁 ENERGÍA EXTRA (DIRECT LINK)</a>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-4 right-4 glass flex justify-around p-4 rounded-3xl shadow-2xl z-50">
        <button onclick="showTab('home')" class="text-2xl hover:scale-110 transition-transform">🏠</button>
        <button onclick="showTab('wheel')" class="text-2xl hover:scale-110 transition-transform">🎡</button>
        <button onclick="showTab('mine')" class="text-2xl hover:scale-110 transition-transform">⛏️</button>
        <button onclick="showTab('refs')" class="text-2xl hover:scale-110 transition-transform">👥</button>
    </nav>

    <script>
        // Variables de Estado
        let pts = 0; let energy = 0; let balance = 0.00; let daily = 0.00; 
        let taps = 0; let isMining = false; let sessionPts = 0;
        let miningSeconds = 10800; // 3 Horas

        function handleTap(e) {
            const touch = e.touches[0];
            createFloat(touch.clientX, touch.clientY);
            pts++; taps++;
            if (taps >= 100) { energy++; taps = 0; }
            updateUI();
        }

        function triggerPopunder() {
            // Abre el anuncio en ventana aparte
            window.open('https://www.profitablecpmratenetwork.com/hjxx0ympqj?key=3816a45c1ebae2a773ddb3dfcdaa95d5', '_blank');
        }

        function startMining() {
            if(isMining) return;
            
            triggerPopunder(); // Disparar anuncio

            isMining = true;
            sessionPts = 0;
            document.getElementById('session-pts').innerText = "0";
            document.getElementById('btn-mine').innerText = "MINANDO...";
            document.getElementById('btn-mine').classList.add('bg-cyan-900/30', 'text-cyan-400', 'border-cyan-500/50');
            document.getElementById('mining-timer').classList.add('mining-active');
            
            // EL RELOJ COMIENZA A MOVERSE AQUÍ
            const timerInterval = setInterval(() => {
                miningSeconds--;
                
                // Formateo visual HH:MM:SS
                let h = Math.floor(miningSeconds / 3600).toString().padStart(2, '0');
                let m = Math.floor((miningSeconds % 3600) / 60).toString().padStart(2, '0');
                let s = (miningSeconds % 60).toString().padStart(2, '0');
                document.getElementById('mining-timer').innerText = `${h}:${m}:${s}`;

                // Ganancia: +1 punto cada 10 segundos
                if (miningSeconds % 10 === 0) {
                    pts += 1;
                    sessionPts += 1;
                    document.getElementById('session-pts').innerText = sessionPts;
                    updateUI();
                }

                // Fin de la sesión
                if (miningSeconds <= 0) {
                    clearInterval(timerInterval);
                    isMining = false;
                    miningSeconds = 10800;
                    document.getElementById('btn-mine').innerText = "ACTIVAR MINERÍA (ADS)";
                    document.getElementById('btn-mine').classList.remove('bg-cyan-900/30', 'text-cyan-400', 'border-cyan-500/50');
                    document.getElementById('mining-timer').classList.remove('mining-active');
                    alert("✅ Sesión de minería completada.");
                }
            }, 1000);
        }

        function spinWheel() {
            if (energy < 1) { alert("¡Necesitas 1 de Energía!"); return; }
            triggerPopunder();
            energy--;
            const wheel = document.getElementById('wheel-graphic');
            wheel.classList.add('spinning');
            updateUI();

            setTimeout(() => {
                wheel.classList.remove('spinning');
                const win = (Math.random() * 0.0015).toFixed(4);
                if (daily < 0.02) {
                    balance += parseFloat(win);
                    daily += parseFloat(win);
                    alert("🎡 ¡Felicidades! Ganaste $" + win);
                } else {
                    alert("Límite diario de USDT alcanzado. ¡Sigue mañana!");
                }
                updateUI();
            }, 2000);
        }

        function createFloat(x, y) {
            const el = document.createElement("div");
            el.innerText = "+1"; el.className = "anim-float";
            el.style.left = x + "px"; el.style.top = y + "px";
            document.body.appendChild(el); setTimeout(() => el.remove(), 600);
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function updateUI() {
            document.getElementById('display-pts').innerText = pts;
            document.getElementById('user-balance').innerText = balance.toFixed(4);
            document.getElementById('user-energy').innerText = energy;
        }

        function copyRef() {
            const el = document.getElementById('ref-link');
            el.select(); document.execCommand('copy');
            alert("¡Link copiado!");
        }

        // Integración Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();
        window.onload = () => {
            const user = tg.initDataUnsafe.user;
            if (user) {
                // Usa el enlace directo /play que creaste en BotFather
                document.getElementById('ref-link').value = "https://t.me/RostyLuckyBot/play?start=" + user.id;
            }
        };
    </script>

    <script src="https://pl29089430.profitablecpmratenetwork.com/dc/73/a2/dc73a2370cdcfb545e7a197bc8bb269a.js"></script>

</body>
</html>
