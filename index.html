<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Orbit by NeoProfit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-text { text-shadow: 0 0 10px #4ade80; }
        body { background: #0f172a; color: white; overflow-x: hidden; }
        #tap-area:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 select-none">

    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-2">
            <div id="user-photo" class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold">U</div>
            <div>
                <p id="user-name" class="text-xs font-bold">Cargando...</p>
                <p class="text-[10px] text-gray-400">Nivel 1: Novato</p>
            </div>
        </div>
        <div class="glass px-3 py-1 rounded-full border-green-500/30">
            <span class="text-green-400 font-bold text-sm">$</span>
            <span id="balance" class="text-sm font-black">0.000000</span>
        </div>
    </div>

    <div class="glass rounded-3xl p-5 mb-6 relative overflow-hidden">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Minería Activa</p>
                <h2 id="mining-display" class="text-2xl font-mono">0.00000000</h2>
            </div>
            <button onclick="showAdAndBoost()" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-2xl transition">
                <i class="fas fa-rocket"></i>
            </button>
        </div>
        <div class="w-full bg-gray-700 h-1 mt-3 rounded-full overflow-hidden">
            <div id="mining-bar" class="bg-blue-400 h-full w-0 transition-all duration-1000"></div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div id="tap-area" onclick="handleTap()" class="glass p-6 rounded-3xl text-center border-yellow-500/20 active:bg-yellow-500/10 transition">
            <div class="relative inline-block">
                <i class="fas fa-bolt text-yellow-400 text-4xl mb-2"></i>
                <span id="energy-count" class="absolute -top-2 -right-4 bg-yellow-500 text-[10px] px-2 rounded-full text-black font-bold">0</span>
            </div>
            <h3 class="text-xs font-black uppercase">Tap Energía</h3>
        </div>

        <div onclick="openRoulette()" class="glass p-6 rounded-3xl text-center border-purple-500/20 opacity-50" id="btn-ruleta">
            <i class="fas fa-dharmachakra text-purple-400 text-4xl mb-2"></i>
            <h3 class="text-xs font-black uppercase">Ruleta</h3>
        </div>

        <div onclick="alert('Próximamente')" class="glass p-6 rounded-3xl text-center border-pink-500/20">
            <i class="fas fa-gamepad text-pink-400 text-4xl mb-2"></i>
            <h3 class="text-xs font-black uppercase">Candy</h3>
        </div>

        <div onclick="showSocial()" class="glass p-6 rounded-3xl text-center border-cyan-500/20">
            <i class="fas fa-share-nodes text-cyan-400 text-4xl mb-2"></i>
            <h3 class="text-xs font-black uppercase">Comunidad</h3>
        </div>
    </div>

    <div class="flex justify-center gap-6 text-xl text-gray-500 mt-4" id="social-links" style="display:none;">
        <a href="https://youtube.com/@TuCanal" target="_blank"><i class="fab fa-youtube hover:text-red-500"></i></a>
        <a href="#" target="_blank"><i class="fab fa-tiktok hover:text-white"></i></a>
        <a href="#" target="_blank"><i class="fab fa-telegram hover:text-blue-400"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram hover:text-pink-500"></i></a>
    </div>

    <button id="claim-bonus-free" style="opacity: 0.01; position: absolute; top:0; left:0; width:1px; height:1px;" onclick="flagAsBot()">Claim $100</button>

    <script>
        // INICIALIZAR TELEGRAM
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let energy = 0;
        let isBot = false;
        let miningValue = 0;

        // Cargar datos de usuario
        if (tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
            if(tg.initDataUnsafe.user.photo_url) {
                document.getElementById('user-photo').innerHTML = `<img src="${tg.initDataUnsafe.user.photo_url}" class="rounded-full">`;
            }
        }

        // LÓGICA TAP-TAP CON ANTI-BOT
        let lastTap = 0;
        function handleTap() {
            if(isBot) return;
            const now = Date.now();
            if(now - lastTap < 50) return; // Bloqueo si es demasiado rápido (bot)
            
            energy++;
            document.getElementById('energy-count').innerText = energy;
            lastTap = now;

            if(energy >= 100) {
                document.getElementById('btn-ruleta').classList.remove('opacity-50');
                document.getElementById('btn-ruleta').classList.add('animate-pulse');
            }
        }

        // LÓGICA MINERÍA
        setInterval(() => {
            miningValue += 0.00000001;
            document.getElementById('mining-display').innerText = miningValue.toFixed(8);
            let progress = (miningValue * 1000000) % 100;
            document.getElementById('mining-bar').style.width = progress + "%";
        }, 1000);

        function flagAsBot() {
            isBot = true;
            alert("Actividad inusual detectada.");
        }

        function showSocial() {
            document.getElementById('social-links').style.display = 'flex';
        }

        // ESPACIO PARA ADSTERRA
        function showAdAndBoost() {
            // Aquí pegaremos el código de Adsterra más adelante
            alert("Viendo anuncio para potenciar minería...");
        }
    </script>
</body>
</html>
