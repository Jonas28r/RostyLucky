<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RostyLucky by NeoProfit</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .neon-border-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); border-color: rgba(168, 85, 247, 0.5); }
        body { background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%); color: white; overflow-x: hidden; min-height: 100vh; }
        #tap-area:active { transform: scale(0.92); transition: 0.1s; }
        .mining-anim { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4 select-none font-sans">

    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <div id="user-photo" class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center font-bold text-xl shadow-lg border-2 border-white/10">
                U
            </div>
            <div>
                <p id="user-name" class="text-sm font-black tracking-wide uppercase">Cargando...</p>
                <div class="flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span>
                    <p class="text-[10px] text-gray-400 font-bold">NIVEL 1: NOVATO</p>
                </div>
            </div>
        </div>
        <div class="glass px-4 py-2 rounded-2xl border-green-500/30 flex flex-col items-end">
            <p class="text-[9px] text-green-400 font-bold uppercase mb-1">Tu Balance USDT</p>
            <div class="flex items-center gap-1">
                <span class="text-green-400 font-black text-lg">$</span>
                <span id="balance" class="text-lg font-black tracking-tighter">0.000000</span>
            </div>
        </div>
    </div>

    <div class="glass rounded-[2.5rem] p-6 mb-6 relative overflow-hidden shadow-2xl border-blue-500/20">
        <div class="flex justify-between items-center relative z-10">
            <div>
                <p class="text-[10px] text-blue-400 font-black uppercase tracking-[0.2em] mb-1">Minería en la Nube</p>
                <h2 id="mining-display" class="text-3xl font-mono font-bold text-blue-100">0.00000000</h2>
            </div>
            <button onclick="showAdAndBoost()" class="bg-blue-600 hover:bg-blue-500 w-14 h-14 rounded-2xl transition shadow-lg shadow-blue-900/40 flex items-center justify-center group">
                <i class="fas fa-rocket text-xl group-hover:scale-110 transition"></i>
            </button>
        </div>
        <div class="w-full bg-gray-800/50 h-1.5 mt-4 rounded-full overflow-hidden">
            <div id="mining-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full w-0 transition-all duration-1000 shadow-[0_0_10px_#3b82f6]"></div>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div id="tap-area" onclick="handleTap()" class="glass p-6 rounded-[2rem] text-center border-yellow-500/20 active:bg-yellow-500/10 transition relative group">
            <div class="relative inline-block mb-2">
                <i class="fas fa-bolt text-yellow-400 text-4xl group-hover:drop-shadow-[0_0_8px_#facc15]"></i>
                <span id="energy-count" class="absolute -top-2 -right-6 bg-yellow-500 text-[11px] px-2.5 py-0.5 rounded-full text-black font-black shadow-lg">0</span>
            </div>
            <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-300">Tap Energía</h3>
        </div>

        <div id="btn-ruleta" onclick="openRoulette()" class="glass p-6 rounded-[2rem] text-center opacity-40 transition-all duration-500">
            <i class="fas fa-dharmachakra text-purple-400 text-4xl mb-2"></i>
            <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-300">Ruleta</h3>
        </div>

        <div onclick="tg.showAlert('El juego de Candy se desbloquea al alcanzar el Nivel 2. ¡Sigue ganando!')" class="glass p-6 rounded-[2rem] text-center border-pink-500/20">
            <i class="fas fa-gem text-pink-500 text-4xl mb-2"></i>
            <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-300">Candy</h3>
        </div>

        <div onclick="showSocial()" class="glass p-6 rounded-[2rem] text-center border-cyan-500/20">
            <i class="fas fa-users text-cyan-400 text-4xl mb-2"></i>
            <h3 class="text-[11px] font-black uppercase tracking-widest text-gray-300">Social</h3>
        </div>
    </div>

    <div id="social-links" class="hidden flex-col items-center gap-6 p-6 glass rounded-3xl animate-bounce-in mt-4">
        <p class="text-[10px] font-black text-gray-400 uppercase">Nuestras Redes Oficiales</p>
        <div class="flex justify-around w-full text-2xl">
            <a href="https://youtube.com/" target="_blank" class="hover:scale-125 transition text-red-500"><i class="fab fa-youtube"></i></a>
            <a href="#" target="_blank" class="hover:scale-125 transition text-white"><i class="fab fa-tiktok"></i></a>
            <a href="#" target="_blank" class="hover:scale-125 transition text-blue-500"><i class="fab fa-telegram"></i></a>
            <a href="#" target="_blank" class="hover:scale-125 transition text-pink-500"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" class="hover:scale-125 transition text-blue-400"><i class="fab fa-facebook"></i></a>
        </div>
    </div>

    <button id="claim-mega-bonus" style="opacity: 0.001; position: absolute; top:0; left:0; width:1px; height:1px;" onclick="flagAsBot()">Claim $500 Now</button>

    <script src="script.js"></script>

    <script>
        // Función para mostrar redes sociales suavemente
        function showSocial() {
            const footer = document.getElementById('social-links');
            footer.classList.toggle('hidden');
            footer.classList.toggle('flex');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>

</body>
</html>
