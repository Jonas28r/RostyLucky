<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RostyLucky Elite</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; height: 72vh; overflow-y: auto; padding-bottom: 100px; }
        .active-tab { display: block; }
        
        /* Burbujas Tap Tap */
        .bubble { position: absolute; pointer-events: none; font-weight: 900; color: #22d3ee; animation: bubbleUp 0.8s ease-out forwards; z-index: 1000; font-size: 24px; text-shadow: 0 0 10px #22d3ee; }
        @keyframes bubbleUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px) translateX(20px); } }

        /* Ruleta Calibrada */
        #wheel-main { width: 280px; height: 280px; border-radius: 50%; border: 6px solid #1e293b; transition: transform 8s cubic-bezier(0.1, 0, 0, 1); background: conic-gradient(#facc15 0 45deg, #eab308 45deg 90deg, #facc15 90deg 135deg, #eab308 135deg 180deg, #facc15 180deg 225deg, #eab308 225deg 270deg, #facc15 270deg 315deg, #eab308 315deg 360deg); }
        .wheel-marker { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; background: #ef4444; clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 50; }

        /* Anuncios */
        #social-bar-container { width: 100%; display: flex; justify-content: center; margin-top: 15px; min-height: 50px; }
    </style>
</head>
<body class="p-4">

    <div class="glass p-4 rounded-2xl mb-4 flex justify-between items-center border-b-2 border-yellow-500/20">
        <div><p class="text-[10px] text-slate-400 font-bold uppercase">Minería Activa</p><p class="text-xl font-black text-yellow-400" id="display-pts">0 pts</p></div>
        <div class="text-right"><p class="text-[10px] text-slate-400 font-bold uppercase italic">Balance Real</p><p class="text-xl font-black text-green-400">$<span id="user-balance">0.0000</span></p></div>
    </div>

    <main>
        <div id="tab-home" class="tab-content active-tab text-center">
            <div class="mb-4 mt-4"><span class="bg-cyan-950 text-cyan-400 px-4 py-1 rounded-full text-[10px] font-black border border-cyan-500/30">⚡ ENERGÍA: <span id="user-energy">0</span></span></div>
            <div id="tap-area" ontouchstart="handleTap(event)" class="relative mx-auto w-56 h-56 bg-gradient-to-tr from-yellow-600 to-orange-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(234,179,8,0.3)] border-[10px] border-white/10 active:scale-95 transition-transform">
                <span class="text-8xl font-black italic text-white/20 select-none">R</span>
            </div>
            
            <div id="social-bar-container">
                <script src="https://pl29089430.profitablecpmratenetwork.com/dc/73/a2/dc73a2370cdcfb545e7a197bc8bb269a.js"></script>
            </div>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.3em] mt-4">Toca para ganar energía</p>
        </div>

        <div id="tab-wheel" class="tab-content text-center pt-4">
            <div class="glass p-6 rounded-[40px] relative">
                <div class="wheel-marker"></div>
                <center><div id="wheel-main"></div></center>
                <button id="btn-spin" onclick="spinWheel()" class="mt-8 w-full bg-yellow-500 text-slate-900 py-4 rounded-2xl font-black uppercase italic tracking-widest">¡GIRAR! (1 ⚡)</button>
            </div>
        </div>

        <div id="tab-mine" class="tab-content text-center pt-10">
            <div class="glass p-8 rounded-3xl border-t-4 border-green-500 shadow-2xl">
                <p class="text-[10px] text-slate-400 uppercase font-black mb-2">Minería Directa USDT</p>
                <p id="mining-timer" class="text-5xl font-mono mb-8 text-white">03:00:00</p>
                <button id="btn-mine" onclick="startMining()" class="w-full bg-green-600 py-4 rounded-2xl font-black shadow-lg">ACTIVAR MINA USDT</button>
                <p class="text-[9px] text-green-400 mt-4 uppercase font-bold tracking-tighter">Generando $0.0001 cada 10 seg</p>
            </div>
        </div>

        <div id="tab-wallet" class="tab-content px-2 pt-4">
            <div class="flex gap-2 mb-6">
                <button onclick="showSection('withdraw')" class="flex-1 bg-yellow-500 text-slate-900 py-2 rounded-xl font-black text-xs uppercase">Retiros</button>
                <button onclick="showSection('refs')" class="flex-1 bg-slate-800 py-2 rounded-xl font-black text-xs uppercase">Referidos</button>
            </div>

            <div id="section-withdraw" class="space-y-3">
                <div onclick="openModal('pago_movil')" class="glass p-4 rounded-xl flex justify-between items-center"><span>🇻🇪 Pago Móvil</span><span class="text-[10px] text-cyan-400 font-bold">MIN $1</span></div>
                <div onclick="openModal('ton')" class="glass p-4 rounded-xl flex justify-between items-center"><span>💎 TON Wallet</span><span class="text-[10px] text-slate-400 font-bold">MIN $5</span></div>
                <div onclick="openModal('airtm')" class="glass p-4 rounded-xl flex justify-between items-center"><span>☁️ Airtm</span><span class="text-[10px] text-slate-400 font-bold">MIN $5</span></div>
                <div onclick="openModal('paypal')" class="glass p-4 rounded-xl flex justify-between items-center"><span>🅿️ PayPal</span><span class="text-[10px] text-slate-400 font-bold">MIN $5</span></div>
            </div>

            <div id="section-refs" style="display:none;" class="glass p-6 rounded-2xl text-center">
                <p class="text-xs font-bold mb-4">Invita y gana el 10% de sus retiros</p>
                <input type="text" id="ref-link" readonly class="w-full bg-black/40 p-3 rounded-lg text-[10px] text-center mb-4 text-yellow-400 border border-yellow-500/20">
                <button onclick="copyRef()" class="w-full bg-cyan-600 py-3 rounded-xl font-black text-xs uppercase">Copiar Link de Invitado</button>
            </div>
        </div>
    </main>

    <div id="withdraw-modal" class="fixed inset-0 bg-black/90 z-[2000] hidden items-center justify-center p-6">
        <div class="glass p-6 rounded-3xl w-full text-center">
            <h3 id="modal-title" class="font-black text-yellow-400 mb-4 uppercase"></h3>
            <input type="number" id="w-amount" step="0.01" placeholder="Monto USD" oninput="calcVes()" class="w-full bg-slate-900 p-3 rounded-xl text-center font-bold mb-2">
            <p id="ves-preview" class="text-cyan-400 text-[10px] font-black mb-4"></p>
            <div id="modal-fields" class="space-y-2 mb-6"></div>
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 bg-slate-800 py-3 rounded-xl text-xs">CERRAR</button>
                <button onclick="submitWithdraw()" class="flex-1 bg-yellow-500 text-slate-900 py-3 rounded-xl font-black text-xs">CONFIRMAR</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-6 left-4 right-4 glass flex justify-around p-4 rounded-[30px] z-50">
        <button onclick="showTab('home')" class="text-2xl">🏠</button>
        <button onclick="showTab('wheel')" class="text-2xl">🎡</button>
        <button onclick="showTab('mine')" class="text-2xl">⛏️</button>
        <button onclick="showTab('wallet')" class="text-2xl">💰</button>
    </nav>

    <script>
        let balance = 0.00; let energy = 0; let pts = 0;
        let isMining = false; let miningSeconds = 10800;
        const TASA_VES = 521.42;
        let activeMethod = "";

        // Popunder y Direct Link (Adsterra)
        function triggerAds() {
            window.open('https://www.profitablecpmratenetwork.com/hjxx0ympqj?key=3816a45c1ebae2a773ddb3dfcdaa95d5', '_blank');
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function showSection(id) {
            document.getElementById('section-withdraw').style.display = id === 'withdraw' ? 'block' : 'none';
            document.getElementById('section-refs').style.display = id === 'refs' ? 'block' : 'none';
        }

        // Tap Tap +1 Burbujas
        function handleTap(e) {
            pts++; if(pts % 40 === 0) energy++;
            const x = e.touches[0].clientX; const y = e.touches[0].clientY;
            const b = document.createElement("div");
            b.className = "bubble"; b.innerText = "+1";
            b.style.left = x + "px"; b.style.top = y + "px";
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 800);
            updateUI();
        }

        // Ruleta Calibrada (Offset 22.5)
        function spinWheel() {
            if(energy < 1) return alert("¡Sin energía!");
            triggerAds();
            energy--; updateUI();
            const wheel = document.getElementById('wheel-main');
            const target = Math.floor(Math.random() * 8);
            const deg = (3600) + (360 - (target * 45)) + 22.5; 
            wheel.style.transform = `rotate(${deg}deg)`;
            setTimeout(() => {
                if([0, 2, 4, 6].includes(target)) {
                    const win = 0.0005; balance += win;
                    alert("¡Ganaste $" + win + " USDT!");
                } else { alert("❌ Sigue intentando"); }
                updateUI();
            }, 8200);
        }

        // Minería USDT REAL
        function startMining() {
            if(isMining) return;
            triggerAds();
            isMining = true;
            document.getElementById('btn-mine').innerText = "MINANDO USDT...";
            const clock = document.getElementById('mining-timer');
            const interval = setInterval(() => {
                miningSeconds--;
                let h = Math.floor(miningSeconds/3600), m = Math.floor((miningSeconds%3600)/60), s = miningSeconds%60;
                clock.innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(miningSeconds % 10 === 0) { balance += 0.0001; updateUI(); }
                if(miningSeconds <= 0) clearInterval(interval);
            }, 1000);
        }

        // Wallet Logic
        function openModal(m) {
            activeMethod = m;
            document.getElementById('withdraw-modal').style.flex = "flex";
            document.getElementById('withdraw-modal').classList.remove('hidden');
            document.getElementById('modal-fields').innerHTML = "";
            const title = document.getElementById('modal-title');
            const fields = document.getElementById('modal-fields');

            if(m === 'pago_movil') {
                title.innerText = "Pago Móvil VZLA";
                fields.innerHTML = `<input type='text' id='f1' placeholder='Banco' class='w-full bg-slate-800 p-3 rounded-lg text-xs'><input type='text' id='f2' placeholder='Cédula' class='w-full bg-slate-800 p-3 rounded-lg text-xs'><input type='text' id='f3' placeholder='Teléfono' class='w-full bg-slate-800 p-3 rounded-lg text-xs'>`;
            } else {
                title.innerText = m.toUpperCase();
                fields.innerHTML = `<input type='text' id='f1' placeholder='${m === 'ton' ? 'Billetera TON' : 'Correo ' + m}' class='w-full bg-slate-800 p-3 rounded-lg text-xs'>`;
            }
        }

        function calcVes() {
            const val = document.getElementById('w-amount').value;
            const hint = document.getElementById('ves-preview');
            if(activeMethod === 'pago_movil' && val > 0) hint.innerText = "RECIBES: " + (val * TASA_VES).toFixed(2) + " Bs.";
            else hint.innerText = "";
        }

        function closeModal() { document.getElementById('withdraw-modal').classList.add('hidden'); }

        function submitWithdraw() {
            const amt = parseFloat(document.getElementById('w-amount').value);
            const min = activeMethod === 'pago_movil' ? 1 : 5;
            if(amt < min) return alert("Mínimo $" + min + " para este método.");
            if(amt > balance) return alert("Saldo insuficiente.");
            triggerAds();
            alert("Solicitud enviada. Procesaremos tu pago pronto.");
            closeModal();
        }

        function updateUI() {
            document.getElementById('display-pts').innerText = pts + " pts";
            document.getElementById('user-balance').innerText = balance.toFixed(4);
            document.getElementById('user-energy').innerText = energy;
        }

        function copyRef() {
            const link = document.getElementById('ref-link');
            link.select(); document.execCommand('copy');
            alert("¡Link copiado!");
        }

        // Inicializar Telegram y Referidos
        const tg = window.Telegram.WebApp;
        tg.expand();
        window.onload = () => {
            const user = tg.initDataUnsafe.user;
            if (user) document.getElementById('ref-link').value = "https://t.me/RostyLuckyBot/play?start=" + user.id;
            updateUI();
        };
    </script>
</body>
</html>
