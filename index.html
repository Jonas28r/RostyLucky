<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RostyLucky App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; height: 75vh; overflow-y: auto; padding: 20px; padding-bottom: 100px; }
        .active-tab { display: block; }
        
        /* Ruleta con 10s de suspenso e Iconos */
        #wheel-main { 
            width: 280px; height: 280px; border-radius: 50%; border: 8px solid #1e293b; 
            transition: transform 10s cubic-bezier(0.15, 0, 0.15, 1); 
            background: conic-gradient(#facc15 0 45deg, #eab308 45deg 90deg, #facc15 90deg 135deg, #eab308 135deg 180deg, #facc15 180deg 225deg, #eab308 225deg 270deg, #facc15 270deg 315deg, #eab308 315deg 360deg);
            position: relative; overflow: hidden;
        }
        .wheel-icon { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; justify-content: center; padding-top: 25px; font-size: 26px; transform-origin: center; }
        .wheel-marker { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 30px; height: 40px; background: #ef4444; clip-path: polygon(0 0, 100% 0, 50% 100%); z-index: 100; }
        
        .bubble { position: absolute; pointer-events: none; font-weight: 900; color: #22d3ee; animation: bubbleUp 0.8s ease-out forwards; z-index: 1000; font-size: 24px; }
        @keyframes bubbleUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

    <div class="glass m-4 p-4 rounded-2xl flex justify-between items-center">
        <div><p class="text-[10px] text-slate-400 font-bold">PUNTOS</p><p class="text-xl font-black text-yellow-400" id="display-pts">0 pts</p></div>
        <div class="text-right"><p class="text-[10px] text-slate-400 font-bold">BALANCE</p><p class="text-xl font-black text-green-400">$<span id="user-balance">0.0000</span></p></div>
    </div>

    <main>
        <div id="tab-home" class="tab-content active-tab text-center">
            <div class="mb-4"><span class="bg-cyan-950 text-cyan-400 px-4 py-1 rounded-full text-[10px] font-bold border border-cyan-500/30">⚡ ENERGÍA: <span id="user-energy">0</span></span></div>
            <div id="tap-area" ontouchstart="handleTap(event)" class="relative mx-auto w-56 h-56 bg-gradient-to-tr from-yellow-600 to-orange-400 rounded-full flex items-center justify-center border-[10px] border-white/10 active:scale-95 transition-transform">
                <span class="text-8xl font-black text-white/20">R</span>
            </div>
            <div class="mt-6 min-h-[50px]" id="ad-container-1">
                <script async src="https://pl29089430.profitablecpmratenetwork.com/dc/73/a2/dc73a2370cdcfb545e7a197bc8bb269a.js"></script>
            </div>
        </div>

        <div id="tab-wheel" class="tab-content text-center">
            <div class="glass p-6 rounded-[40px] relative">
                <div class="wheel-marker"></div>
                <center>
                    <div id="wheel-main">
                        <div class="wheel-icon" style="transform: rotate(22.5deg)">💰</div>
                        <div class="wheel-icon" style="transform: rotate(67.5deg)">❌</div>
                        <div class="wheel-icon" style="transform: rotate(112.5deg)">💎</div>
                        <div class="wheel-icon" style="transform: rotate(157.5deg)">❌</div>
                        <div class="wheel-icon" style="transform: rotate(202.5deg)">💵</div>
                        <div class="wheel-icon" style="transform: rotate(247.5deg)">❌</div>
                        <div class="wheel-icon" style="transform: rotate(292.5deg)">🪙</div>
                        <div class="wheel-icon" style="transform: rotate(337.5deg)">❌</div>
                    </div>
                </center>
                <button onclick="spinWheel()" class="mt-8 w-full bg-yellow-500 text-slate-900 py-4 rounded-2xl font-black uppercase italic shadow-lg active:scale-95">¡GIRAR! (1 ⚡)</button>
            </div>
        </div>

        <div id="tab-mine" class="tab-content text-center pt-10">
            <div class="glass p-8 rounded-3xl border-t-4 border-green-500">
                <p id="mining-timer" class="text-5xl font-mono mb-8">03:00:00</p>
                <button id="btn-mine" onclick="startMining()" class="w-full bg-green-600 py-4 rounded-2xl font-black uppercase">Activar Mina</button>
            </div>
        </div>

        <div id="tab-wallet" class="tab-content">
            <div class="glass p-6 rounded-2xl text-center mb-4">
                <p class="text-xs font-bold mb-2 uppercase text-slate-400">Tu Enlace de Invitado</p>
                <input type="text" id="ref-link" readonly class="w-full bg-black/40 p-3 rounded-lg text-[10px] text-center text-yellow-400 mb-2 border border-yellow-500/20">
                <button onclick="copyRef()" class="w-full bg-cyan-600 py-2 rounded-xl font-bold text-xs">COPIAR LINK</button>
            </div>
            <div class="space-y-2">
                <div class="glass p-4 rounded-xl flex justify-between"><span>🇻🇪 Pago Móvil</span><span class="text-green-400 font-bold">$1 Min</span></div>
                <div class="glass p-4 rounded-xl flex justify-between"><span>💎 TON Wallet</span><span class="text-slate-400 font-bold">$5 Min</span></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-4 right-4 glass flex justify-around p-4 rounded-[30px] z-50">
        <button onclick="showTab('home')" class="text-2xl">🏠</button>
        <button onclick="showTab('wheel')" class="text-2xl">🎡</button>
        <button onclick="showTab('mine')" class="text-2xl">⛏️</button>
        <button onclick="showTab('wallet')" class="text-2xl">💰</button>
    </nav>

    <script>
        // Inicializar Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready(); // CRÍTICO PARA TELEGRAM

        let balance = 0.00; let energy = 0; let pts = 0;
        let isMining = false; let miningSeconds = 10800;

        function triggerAds() { window.open('https://www.profitablecpmratenetwork.com/hjxx0ympqj?key=3816a45c1ebae2a773ddb3dfcdaa95d5', '_blank'); }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }

        function handleTap(e) {
            pts++; if(pts % 50 === 0) energy++;
            const x = e.touches[0].clientX; const y = e.touches[0].clientY;
            const b = document.createElement("div");
            b.className = "bubble"; b.innerText = "+1";
            b.style.left = (x - 10) + "px"; b.style.top = (y - 10) + "px";
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 800);
            updateUI();
        }

        function spinWheel() {
            if(energy < 1) { tg.showAlert("¡No tienes energía! Toca el botón central."); return; }
            triggerAds();
            energy--; updateUI();
            const wheel = document.getElementById('wheel-main');
            const target = Math.floor(Math.random() * 8);
            const deg = (3600) + (360 - (target * 45)) + 22.5; 
            wheel.style.transform = `rotate(${deg}deg)`;
            
            setTimeout(() => {
                if([0, 2, 4, 6].includes(target)) {
                    const win = 0.0008; balance += win;
                    tg.showAlert("💎 ¡Felicidades! Has ganado $" + win + " USDT.");
                } else { tg.showAlert("❌ Sigue intentando."); }
                updateUI();
            }, 10200); 
        }

        function startMining() {
            if(isMining) return;
            triggerAds(); isMining = true;
            document.getElementById('btn-mine').innerText = "MINANDO...";
            const interval = setInterval(() => {
                miningSeconds--;
                let h = Math.floor(miningSeconds/3600), m = Math.floor((miningSeconds%3600)/60), s = miningSeconds%60;
                document.getElementById('mining-timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                if(miningSeconds % 10 === 0) { balance += 0.0001; updateUI(); }
                if(miningSeconds <= 0) { clearInterval(interval); isMining = false; }
            }, 1000);
        }

        function updateUI() {
            document.getElementById('display-pts').innerText = pts + " pts";
            document.getElementById('user-balance').innerText = balance.toFixed(4);
            document.getElementById('user-energy').innerText = energy;
        }

        function copyRef() {
            const link = document.getElementById('ref-link');
            link.select(); document.execCommand('copy'); tg.showScanQrPopup({text: "Copiado!"});
        }

        window.onload = () => {
            const user = tg.initDataUnsafe.user;
            if (user) document.getElementById('ref-link').value = "https://t.me/RostyLuckyBot/play?start=" + user.id;
            updateUI();
        };
    </script>
</body>
</html>
